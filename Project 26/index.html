<!DOCTYPE html>
<html>

<head>
    <title>My Superhero Power Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff4d4d;
        }

        p {
            color: #444444;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid #ff4d4d;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .hero-power {
            color: #0057b8;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>My Superhero Power Cards</h1>

    <p>
        Click the button to create superhero objects using JavaScript classes.
    </p>

    <button onclick="showHeroes()">Show Superheroes</button>

    <div class="card-container" id="heroCards"></div>

    <script>
        class Superhero {
            constructor(name, power, mission) {
                this.name = name;
                this.power = power;
                this.mission = mission;
            }

            describeHero() {
                return "<div class='hero-card'>" +
                    "<p class='hero-name'>" + this.name + "</p>" +
                    "<p class='hero-power'>Power: " + this.power + "</p>" +
                    "<p class='hero-mission'>Mission: " + this.mission + "</p>" +
                    "</div>";
            }
        }

        function showHeroes() {
            let hero1 = new Superhero(
                "Iron Man",
                "Powered armor suit & genius intellect",
                "Use advanced technology to protect the world."
            );

            let hero2 = new Superhero(
                "Batman",
                "Martial arts mastery & detective skills",
                "Fight crime and bring justice to Gotham City."
            );

            let hero3 = new Superhero(
                "Spider-Man",
                "Wall-crawling, web-shooting & spider-sense",
                "Protect the neighborhood with great responsibility."
            );

            let hero4 = new Superhero(
                "Thor",
                "God of Thunder & Mjolnir mastery",
                "Defend Asgard and the Nine Realms from threats."
            );

            document.getElementById("heroCards").innerHTML =
                hero1.describeHero() +
                hero2.describeHero() +
                hero3.describeHero() +
                hero4.describeHero();
        }
    </script>

</body>

</html>

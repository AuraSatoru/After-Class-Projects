<!DOCTYPE html>
<html>

<head>
    <title>Student Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .output {
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            margin-top: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Student Profile</h2>
        <div class="output" id="result"></div>
    </div>

    <script>
        var student = {
            name: 'Garv',
            age: '14',
            Grade: '9',
            hobbies: 'Playing video games',
            "fav sport": 'Football'
        };

        var color = ["white", "black", "red", "green", "blue"];

        var text = "Student name is : " + student.name + "<br>";
        text += "Student favorite sport is : " + student["fav sport"] + "<br><br>";
        text += "Before Poping the colors are: " + color.join("^") + "<br>";
        text += "My favorite color is : " + color[3] + "<br><br>";

        color.pop();

        text += "After Poping the colors are : " + color.join("*");

        document.getElementById("result").innerHTML = text;
    </script>

</body>

</html>

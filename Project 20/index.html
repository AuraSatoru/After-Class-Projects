<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiply Function Example</title>
</head>
<body>

    <button onclick="multiply(4)">Click Me!</button>
    <p id="result"></p>

    <script>
        function multiply(a, b = 5) {
            var product = a * b;
            document.getElementById("result").innerText = "Result = " + product;
        }
    </script>
</body>
</html>

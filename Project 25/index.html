<!DOCTYPE html>
<html>

<head>
    <title>My Birthday Countdown Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 480px;
            background: white;
            border: 4px solid #ff6f91;
            border-radius: 20px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            color: rgb(255, 0, 0);
        }

        button {
            background: #ff477e;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .box {
            background: #ff89b0;
            border: 2px dashed #ff6f91;
            border-radius: 12px;
            padding: 10px;
            margin-top: 12px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>My Birthday Countdown Checker</h1>
        <button onclick="checkCountdown()">Check Countdown</button>
        <div class="box">
            <h3>Missing Details</h3>
            <p id="missing"></p>
        </div>
        <div class="box">
            <h3>Greeting</h3>
            <p id="greeting"></p>
        </div>
        <div class="box">
            <h3>Days Left</h3>
            <p id="message"></p>
        </div>
        <div class="box">
            <h3>Countdown</h3>
            <p id="countdown"></p>
        </div>
    </div>

    <script>
        function checkCountdown() {
            let friendName = "Garv";
            let daysLeft = 3;

            let giftIdea = null;
            let cakeFlavour;
            document.getElementById("missing").innerHTML = "Gift idea: " + giftIdea + " | Cake flavour: " + cakeFlavour;

            let hour = new Date().getHours();
            let greetingText = "";
            if (hour < 12) {
                greetingText = "Good morning, ";
            } else if (hour < 17) {
                greetingText = "Good afternoon, ";
            } else {
                greetingText = "Good evening, ";
            }
            document.getElementById("greeting").innerHTML = greetingText + friendName + "!";

            let messageText = "";
            if (daysLeft == 0) {
                messageText = "Today is the party!";
            } else if (daysLeft == 1) {
                messageText = "Tomorrow is the party!";
            } else {
                messageText = daysLeft + " days to go!";
            }
            document.getElementById("message").innerHTML = messageText;

            let countdownText = "";
            let count = daysLeft;
            while (count >= 1) {
                countdownText += "Days left: " + count + "<br>";
                count--;
            }
            countdownText += "Party time!";
            document.getElementById("countdown").innerHTML = countdownText;
        }
    </script>
</body>

</html>
